# Build `idr` and `idrt`, wrap them with native bits from
# https://github.com/idrto/agent/releases/tag/e2e-latest (e2e branch).
# Dart FFI packages come from idrto/agent@e2e — no cargo build here.
#
# Layout matches local monorepo paths (pubspec path: ../../../../…):
#   applications/apps/     this repo
#   agents_engine/agent/   idrto/agent@e2e
#   Auth_repo/2key-billing-sdks/   dev10m-adv/2key-billing-sdks@feat/idr-target-headless-sdk

name: CLI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: cli-${{ github.ref }}
  # A newer push cancels the older run, on main too. Queueing instead let a run whose
  # jobs never got a runner block every later run for up to 24 h. Cancelling a publish
  # is safe: vm-publish.sh swaps the manifest last, so the previous release stays live.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.cli }} ${{ matrix.target.plat }}
    runs-on: ${{ matrix.target.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        cli: [idr, idrt]
        # macOS is opt-in (repository variable BUILD_MACOS=true): its runners need
        # macOS Actions minutes, and a job that never gets a runner blocks publish.
        target: ${{ fromJSON(vars.BUILD_MACOS == 'true'
          && '[{"os":"ubuntu-latest","plat":"linux-x64"},{"os":"windows-latest","plat":"windows-x64"},{"os":"macos-latest","plat":"macos-arm64"}]'
          || '[{"os":"ubuntu-latest","plat":"linux-x64"},{"os":"windows-latest","plat":"windows-x64"}]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: applications/apps

      - uses: actions/checkout@v4
        with:
          repository: idrto/agent
          ref: e2e
          path: agents_engine/agent

      - uses: actions/checkout@v4
        with:
          repository: dev10m-adv/2key-billing-sdks
          ref: feat/idr-target-headless-sdk
          path: Auth_repo/2key-billing-sdks

      - name: Fetch e2e agent binaries
        run: |
          set -euo pipefail
          curl -fsSL -o e2e-agent-binaries.zip \
            https://github.com/idrto/agent/releases/download/e2e-latest/e2e-agent-binaries.zip
          mkdir -p agent-dist
          python -c "import zipfile; zipfile.ZipFile('e2e-agent-binaries.zip').extractall('agent-dist')"
          find agent-dist -type f | sort

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build ${{ matrix.cli }}
        env:
          CLI: ${{ matrix.cli }}
          PLAT: ${{ matrix.target.plat }}
        run: |
          set -euo pipefail
          if [[ "${CLI}" == idr ]]; then
            pkg=applications/apps/idr_sources_cli
            bin=bin/idr.dart
          else
            pkg=applications/apps/idr_target_cli
            bin=bin/idrt.dart
          fi
          exe="${CLI}"
          [[ "${RUNNER_OS}" == Windows ]] && exe="${CLI}.exe"

          dart pub get --directory "${pkg}"
          mkdir -p dist
          # `dart compile exe` rejects packages with build hooks (objective_c).
          dart build cli -t "${pkg}/${bin}" -o build-out
          cp -v "build-out/bundle/bin/${exe}" dist/
          if [[ -d build-out/bundle/lib ]]; then cp -rv build-out/bundle/lib/. dist/; fi
          # Production build: only config/prod.json ships (the default flavor of a release exe).
          mkdir -p dist/config
          cp -v applications/apps/config/prod.json dist/config/

          if [[ "${CLI}" == idr ]]; then
            # Everything the agent repo ships for Source except build-time files
            # (import .lib, header): idr_c_api (WebRTC), source-agent (`idr transfer`),
            # idr_dp (enroll certificates) and, on Windows, the OpenSSL + VC++ DLLs.
            src="agent-dist/source/${PLAT}"
            for f in "${src}"/*; do
              case "$f" in *.lib|*.h) ;; *) cp -v "$f" dist/ ;; esac
            done
          else
            # target-agent plus idr_dp (registration certificates) and, on Windows,
            # the OpenSSL + VC++ DLLs the agent repo ships beside it.
            tgt="agent-dist/target/${PLAT}"
            cp -v "${tgt}"/* dist/
            chmod +x dist/target-agent 2>/dev/null || true
          fi
          ls dist/*idr_dp* >/dev/null || { echo "::error::idr_dp missing from e2e-agent-binaries.zip (agent repo e2e binaries workflow)"; exit 1; }
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.cli }}-${{ matrix.target.plat }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  target-app:
    name: idr_target_app ${{ matrix.plat }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            plat: linux-x64
          - os: windows-latest
            plat: windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          path: applications/apps

      - uses: actions/checkout@v4
        with:
          repository: idrto/agent
          ref: e2e
          path: agents_engine/agent

      - uses: actions/checkout@v4
        with:
          repository: dev10m-adv/2key-billing-sdks
          ref: feat/idr-target-headless-sdk
          path: Auth_repo/2key-billing-sdks

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Linux desktop deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev libjsoncpp-dev

      - name: Analyze and test
        working-directory: applications/apps/idr_target_app
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: applications/apps/idr_target_app
        run: flutter build windows --release

      # The app looks for target-agent and idr_dp next to its exe.
      - name: Bundle agent binaries (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          curl -fsSL -o e2e-agent-binaries.zip             https://github.com/idrto/agent/releases/download/e2e-latest/e2e-agent-binaries.zip
          mkdir -p agent-dist
          python -c "import zipfile; zipfile.ZipFile('e2e-agent-binaries.zip').extractall('agent-dist')"
          rel=applications/apps/idr_target_app/build/windows/x64/runner/Release
          cp -v agent-dist/target/windows-x64/* "${rel}/"
          # Production build: only config/prod.json ships (the default flavor of a release exe).
          mkdir -p "${rel}/config"
          cp -v applications/apps/config/prod.json "${rel}/config/"
          test -f "${rel}/target-agent.exe"
          # idr_dp + OpenSSL/VC++ DLLs come with target/windows-x64 from the agent repo.
          test -f "${rel}/idr_dp.dll" || { echo "::error::idr_dp.dll missing from e2e-agent-binaries.zip"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: idr_target_app-${{ matrix.plat }}
          path: applications/apps/idr_target_app/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14

  # IDR-Setup.exe: the Windows bootstrapper (component picker + downloader).
  # One build per channel because the channel is baked in.
  setup-windows:
    name: IDR Setup (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: applications/apps
      - name: Build IDR-Setup.exe
        working-directory: applications/apps/release/installer/windows
        run: |
          set -euo pipefail
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -x "$iscc" ]] || choco install innosetup -y --no-progress
          version="$(tr -d '\r\n' < ../../../VERSION)-${GITHUB_RUN_NUMBER}"
          for channel in staging stable; do
            MSYS_NO_PATHCONV=1 "$iscc" /Q "/DChannel=${channel}" "/DAppVersion=${version}" idr-setup.iss
          done
          ls -la Output
      - uses: actions/upload-artifact@v4
        with:
          name: idr-setup-windows
          path: applications/apps/release/installer/windows/Output/
          if-no-files-found: error
          retention-days: 14

  # main → GitHub prerelease + versioned packages, setup installers and the signed
  # manifest on the VM. The download website (Auth_repo/download-site) deploys on its
  # own and reads that manifest. Stable only via the Promote workflow. See release/README.md.
  publish:
    name: Publish to staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, target-app, setup-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
    concurrency:
      group: publish-downloads
      cancel-in-progress: false
    env:
      PUBLIC: https://billing.idr.to
      CHANNEL: staging
    steps:
      - uses: actions/checkout@v4
        with:
          path: applications/apps

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < applications/apps/VERSION)-${GITHUB_RUN_NUMBER}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          python3 applications/apps/release/package.py build --artifacts artifacts \
            --version "${version}" --channel "${CHANNEL}" --commit "${GITHUB_SHA}" --out out
          cp applications/apps/release/release-key.pem out/

      - name: Sign manifest
        env:
          SIGNING_KEY: ${{ secrets.IDR_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [[ -n "${SIGNING_KEY}" ]] || { echo "::error::Secret IDR_RELEASE_SIGNING_KEY is not set (see release/README.md)."; exit 1; }
          key="$(mktemp)"; trap 'rm -f "$key"' EXIT
          printf '%s\n' "${SIGNING_KEY}" > "$key"
          for f in manifest.json manifest.tsv; do
            openssl dgst -sha256 -sign "$key" -out "out/$f.sig" "out/$f"
            openssl dgst -sha256 -verify out/release-key.pem -signature "out/$f.sig" "out/$f"
          done
          tar -C out -czf bundle.tgz packages release-key.pem manifest.json manifest.json.sig manifest.tsv manifest.tsv.sig
          ls -la bundle.tgz

      # Same files as on the VM, as a GitHub prerelease (asset names must be unique).
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          p="out/packages/${VERSION}"; tag="staging-${VERSION}"
          files=("$p"/*.zip "$p"/*.tar.gz "$p"/standalone/* "$p/setup/staging/IDR-Setup.exe" "$p/setup/staging/idr-setup.sh"
                 "$p/SHA256SUMS" out/manifest.json out/manifest.json.sig)
          if gh release view "$tag" >/dev/null 2>&1; then   # re-run of the same run number
            gh release upload "$tag" --clobber "${files[@]}"
          else
            gh release create "$tag" --prerelease --target "${GITHUB_SHA}" --title "Staging ${VERSION}" \
              --notes "Staging build of ${GITHUB_SHA}. Download page: ${PUBLIC}/staging/download/" "${files[@]}"
          fi

      - name: Upload to VM
        env:
          SSHPASS: ${{ secrets.SERVER_1_PASSWORD }}
          HOST: ${{ secrets.SERVER_1_HOST }}
          VM_USER: ${{ secrets.SERVER_1_USER }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq sshpass >/dev/null
          # Host key pinned in the repo; never trust-on-first-use. Password via $SSHPASS (not argv).
          opts=(-o HostKeyAlias=idr-vm -o "UserKnownHostsFile=${PWD}/applications/apps/release/known_hosts"
                -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no -o PreferredAuthentications=password
                -o ConnectTimeout=20 -o ServerAliveInterval=15)
          in="/opt/idr-downloads/.incoming"
          id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sshpass -e ssh "${opts[@]}" "${VM_USER}@${HOST}" "mkdir -p ${in}"
          sshpass -e scp -q "${opts[@]}" bundle.tgz "${VM_USER}@${HOST}:${in}/${id}.tgz"
          sshpass -e scp -q "${opts[@]}" applications/apps/release/vm-publish.sh "${VM_USER}@${HOST}:${in}/${id}.sh"
          sshpass -e ssh "${opts[@]}" "${VM_USER}@${HOST}" \
            "bash ${in}/${id}.sh publish ${CHANNEL} ${VERSION} ${in}/${id}.tgz </dev/null; rc=\$?; rm -f ${in}/${id}.tgz ${in}/${id}.sh; exit \$rc"

      - name: Verify public URLs
        run: bash applications/apps/release/verify-public.sh "${PUBLIC}" "${CHANNEL}" out
